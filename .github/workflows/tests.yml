name: Mobile Tests

on:
  push:
  workflow_dispatch:

jobs:
  # ── Upload apps to BrowserStack (always upload to guarantee fresh binaries) ────
  upload-apps:
    name: Upload apps to BrowserStack
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Upload Calculator APK
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
        run: |
          echo "⬆️  Uploading app/calculator.apk as GoogleCalculator …"
          HTTP_STATUS=$(curl -s -o /tmp/bs_calc.json -w "%{http_code}" \
            -u "$BROWSERSTACK_USERNAME:$BROWSERSTACK_ACCESS_KEY" \
            -X POST "https://api-cloud.browserstack.com/app-automate/upload" \
            -F "file=@app/calculator.apk" \
            -F "custom_id=GoogleCalculator")
          echo "HTTP $HTTP_STATUS — $(cat /tmp/bs_calc.json)"
          [[ "$HTTP_STATUS" -ge 200 && "$HTTP_STATUS" -lt 300 ]] || exit 1
          jq -e '.app_url' /tmp/bs_calc.json > /dev/null

      - name: Upload MDA APK
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
        run: |
          echo "⬆️  Uploading app/mda-2.2.0-25.apk as SauceLabs_MDA …"
          HTTP_STATUS=$(curl -s -o /tmp/bs_mda.json -w "%{http_code}" \
            -u "$BROWSERSTACK_USERNAME:$BROWSERSTACK_ACCESS_KEY" \
            -X POST "https://api-cloud.browserstack.com/app-automate/upload" \
            -F "file=@app/mda-2.2.0-25.apk" \
            -F "custom_id=SauceLabs_MDA")
          echo "HTTP $HTTP_STATUS — $(cat /tmp/bs_mda.json)"
          [[ "$HTTP_STATUS" -ge 200 && "$HTTP_STATUS" -lt 300 ]] || exit 1
          jq -e '.app_url' /tmp/bs_mda.json > /dev/null

  # ── Run smoke tests, then generate and publish the Allure report ──────────────
  test-browserstack:
    name: BrowserStack – Google Pixel 10 (Android 16)
    runs-on: ubuntu-latest
    needs: upload-apps

    steps:
      - uses: actions/checkout@v5

      - name: Install uv (includes Python 3.13)
        uses: astral-sh/setup-uv@v8
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync

      - name: Run tests on BrowserStack
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          BS_TARGET: "1"
          BS_SESSION_NAME: "commit-${{ github.sha }}"
        run: uv run pytest tests/ -v -m smoke

      - name: Install Allure CLI
        if: always()
        run: |
          curl -o allure.tgz -sL \
            https://github.com/allure-framework/allure2/releases/download/2.30.0/allure-2.30.0.tgz
          tar -xzf allure.tgz
          echo "$PWD/allure-2.30.0/bin" >> "$GITHUB_PATH"

      - name: Generate Allure report
        if: always()
        run: allure generate reports/allure-results --clean -o reports/allure-report

      - name: Upload Allure report artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: allure-report-${{ github.sha }}
          path: reports/allure-report
          retention-days: 30
