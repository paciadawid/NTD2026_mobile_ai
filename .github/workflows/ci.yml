name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    name: Code check (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.1.0

      - name: Install dependencies
        run: uv sync

      - name: ruff lint
        run: uv run ruff check .

      - name: ruff format check
        run: uv run ruff format --check .

  test:
    name: Tests (BrowserStack)
    runs-on: ubuntu-latest
    needs: lint
    env:
      TARGET: browserstack
      APP_PATH: calculator.apk
      BS_USERNAME: ${{ secrets.BS_USERNAME }}
      BS_ACCESS_KEY: ${{ secrets.BS_ACCESS_KEY }}
      BROWSERSTACK_DEVICE: Google Pixel 9
      BROWSERSTACK_OS_VERSION: "15.0"
      BUILD_NAME: "CI ${{ github.run_number }}"

    steps:
      - uses: actions/checkout@v6

      - name: Copy .env.example to .env
        run: cp .env.example .env

      - uses: astral-sh/setup-uv@v8.1.0

      - name: Install dependencies
        run: uv sync

      - name: Upload APK to BrowserStack
        run: |
          RESPONSE=$(curl -s \
            -u "$BS_USERNAME:$BS_ACCESS_KEY" \
            -X POST "https://api-cloud.browserstack.com/app-automate/upload" \
            -F "file=@$APP_PATH")
          BS_URL=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin)['app_url'])")
          echo "BROWSERSTACK_APP_URL=$BS_URL" >> "$GITHUB_ENV"

      - name: Run tests
        run: uv run pytest tests/ -v --tb=short --alluredir=reports/allure-results -n 5

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-${{ github.run_number }}
          path: reports/allure-results/
          retention-days: 30

  publish:
    name: Publish Allure Report to GitHub Pages
    runs-on: ubuntu-latest
    needs: test
    if: always()
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download Allure results
        uses: actions/download-artifact@v8
        with:
          name: allure-results-${{ github.run_number }}
          path: allure-results

      - name: Install Allure CLI
        run: npm install -g allure-commandline

      - name: Generate Allure report
        run: allure generate allure-results -o allure-report --clean

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: allure-report

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
