name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

jobs:
  lint:
    name: Code check (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      - name: ruff lint
        run: uv run ruff check .

      - name: ruff format check
        run: uv run ruff format --check .

  test:
    name: Tests (BrowserStack)
    runs-on: ubuntu-latest
    needs: lint
    env:
      TARGET: browserstack
      APP_PATH: calculator.apk
      BS_USERNAME: ${{ secrets.BS_USERNAME }}
      BS_ACCESS_KEY: ${{ secrets.BS_ACCESS_KEY }}
      BROWSERSTACK_DEVICE: Google Pixel 7
      BROWSERSTACK_OS_VERSION: "13.0"
      BUILD_NAME: "CI ${{ github.run_number }}"

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      - name: Upload APK to BrowserStack
        run: |
          RESPONSE=$(curl -s \
            -u "$BS_USERNAME:$BS_ACCESS_KEY" \
            -X POST "https://api-cloud.browserstack.com/app-automate/upload" \
            -F "file=@$APP_PATH")
          BS_URL=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin)['app_url'])")
          echo "BROWSERSTACK_APP_URL=$BS_URL" >> "$GITHUB_ENV"

      - name: Run tests
        run: uv run pytest tests/ -v --tb=short
